<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DentaFlow CRM — Prototip</title>
<meta name="description" content="Diş klinikleri için CRM prototipi: lead, vaka, şematik tedavi planı, teklif ve hasta yolculuğu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7C86'/%3E%3Cpath d='M10 8c-3 0-4 3-3.5 6 .4 2.4 1.2 4.3 1.8 7 .4 1.8 1 3 2 3s1.4-1.5 1.8-3.5c.3-1.3.9-2.5 1.9-2.5s1.6 1.2 1.9 2.5c.4 2 .8 3.5 1.8 3.5s1.6-1.2 2-3c.6-2.7 1.4-4.6 1.8-7 .5-3-.5-6-3.5-6-2 0-2.6 1-4 1s-2-1-4-1z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --brand:#0E7C86; --brand-ink:#fff; --brand-soft:#E6F4F5; --accent:#F59E0B;
  --bg:#F5F7F9; --card:#FFFFFF; --subtle:#F1F4F6; --text:#0F1B24; --muted:#5D6B76; --faint:#94A3AE;
  --line:#E3E8EC; --line-2:#D3DAE0; --ok:#0F8A5F; --ok-bg:#E5F6EF; --warn:#A35F00; --warn-bg:#FFF3DC; --err:#B42318; --err-bg:#FDECEA; --info:#2563EB; --info-bg:#E8F0FE;
  --v1:#10B981; --v2:#F59E0B; --v3:#6366F1; --v4:#EC4899; --v5:#0EA5E9; --v6:#84CC16;
  --r-sm:6px; --r:10px; --r-lg:14px; --sh:0 1px 2px rgba(15,27,36,.05),0 2px 8px rgba(15,27,36,.04); --sh-lg:0 12px 40px rgba(15,27,36,.16);
  --side:232px; --top:56px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","Noto Sans Arabic",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand-soft:#123237; --bg:#0D1317; --card:#141C21; --subtle:#1A242A; --text:#E6EDF1; --muted:#9AA8B2; --faint:#6B7A84;
  --line:#25313A; --line-2:#31404A; --ok:#4ADE9B; --ok-bg:#12302A; --warn:#F5C26B; --warn-bg:#352A14; --err:#F79A8E; --err-bg:#3A1C19; --info:#8AB4FF; --info-bg:#172540;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand-soft:#123237; --bg:#0D1317; --card:#141C21; --subtle:#1A242A; --text:#E6EDF1; --muted:#9AA8B2; --faint:#6B7A84;
  --line:#25313A; --line-2:#31404A; --ok:#4ADE9B; --ok-bg:#12302A; --warn:#F5C26B; --warn-bg:#352A14; --err:#F79A8E; --err-bg:#3A1C19; --info:#8AB4FF; --info-bg:#172540;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column;gap:8px}
.between{justify-content:space-between} .end{justify-content:flex-end}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.hide{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:14px 16px;height:var(--top);font-weight:750;letter-spacing:-.02em;font-size:16px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal}
.logo b{color:var(--brand)}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav .sec{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;position:relative}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--subtle);color:var(--text)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a .bdg{margin-inline-start:auto}
.nav a.soon{opacity:.55;pointer-events:none}
.me{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--brand);flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:var(--top);position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 12px 0 34px}
[dir=rtl] .search input{padding:0 34px 0 12px}
.search svg{position:absolute;inset-inline-start:10px;top:9px;width:18px;height:18px;color:var(--faint)}
.search .kbd{position:absolute;inset-inline-end:8px;top:8px}
.sres{position:absolute;top:40px;inset-inline:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-lg);overflow:hidden;z-index:50}
.sres a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--text)} .sres a:hover,.sres a.on{background:var(--subtle)}
.page{padding:22px 24px 60px;max-width:1440px;width:100%;margin:0 auto}
.phead{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.phead .grow p{margin:4px 0 0;color:var(--muted)}
.burger{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:260px;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--sh-lg)}
  [dir=rtl] .side{transform:translateX(105%)}
  .side.open{transform:none!important}
  .burger{display:inline-flex}
  .page{padding:16px 16px 60px}
  .top{padding:0 12px}
}
.scrim{position:fixed;inset:0;background:rgba(8,15,20,.38);z-index:25}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--subtle)} .btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)} .btn.pri:hover{filter:brightness(1.07)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#1b1300}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--subtle)}
.btn.danger{color:var(--err)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.xs{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.btn.icon{width:36px;padding:0} .btn.sm.icon{width:30px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.inp,select.inp,textarea.inp{height:36px;border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:0 10px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.inp.sm{height:30px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:550}
label.f>.inp{color:var(--text);font-size:14px;font-weight:400}
.seg{display:inline-flex;background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:550}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--sh)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.bdg{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--subtle);color:var(--muted);white-space:nowrap}
.bdg.ok{background:var(--ok-bg);color:var(--ok)} .bdg.warn{background:var(--warn-bg);color:var(--warn)} .bdg.err{background:var(--err-bg);color:var(--err)} .bdg.info{background:var(--info-bg);color:var(--info)} .bdg.brand{background:var(--brand-soft);color:var(--brand)}
.bdg.n{min-width:20px;justify-content:center;padding:0 6px;background:var(--brand);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kbd{font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--faint);background:var(--card)}
.switch{position:relative;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:999px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--brand)} .switch input:checked+span:before{transform:translateX(16px)}

/* ---------- cards & tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card>.bd{padding:16px}
.card.pad{padding:16px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .d{font-size:12px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:start;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer} .tbl tbody tr.click:hover td{background:var(--subtle)}
.tbl .r{text-align:end}
.twrap{overflow:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--text);border-bottom-color:var(--brand)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:8px}

/* ---------- kanban ---------- */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 272px;background:var(--subtle);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.kcol .kh{padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px}
.kcol .kb{padding:0 8px 8px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcol.over{outline:2px dashed var(--brand);outline-offset:-2px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.kcard:hover{border-color:var(--line-2)} .kcard.drag{opacity:.4}

/* ---------- journey strip ---------- */
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
.journey a{padding:14px 14px 12px;color:var(--text);border-inline-end:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:2px}
.journey a:last-child{border-inline-end:0}
.journey a:hover{background:var(--subtle)}
.journey .n{font-size:22px;font-weight:700}
.journey .s{font-size:12px;color:var(--muted);font-weight:550}
.journey .bar{position:absolute;inset-inline:0;bottom:0;height:3px}
@media (max-width:760px){.journey{grid-template-columns:repeat(3,1fr)}.journey a:nth-child(3){border-inline-end:0}.journey a:nth-child(-n+3){border-bottom:1px solid var(--line)}}

/* ---------- drawer / modal / toast ---------- */
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(520px,100%);background:var(--card);z-index:60;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:din .18s ease-out}
@keyframes din{from{transform:translateX(30px);opacity:0}}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .bd{padding:18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.drawer .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:70;padding:16px}
.modal .box{background:var(--card);border-radius:16px;box-shadow:var(--sh-lg);width:min(560px,100%);max-height:90vh;overflow:auto;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal .box .hd{padding:18px 20px 6px;display:flex;gap:12px;align-items:flex-start}
.modal .box .bd{padding:8px 20px 16px}
.modal .box .ft{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
[dir=rtl] .toasts{transform:translateX(50%)}
.toast{background:#102027;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--sh-lg);font-weight:500;display:flex;gap:10px;align-items:center;animation:pop .16s}
.toast button{background:none;border:0;color:#7FE0E8;font-weight:650;cursor:pointer}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;align-items:flex-start}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert.err{background:var(--err-bg);color:var(--err)} .alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.ok{background:var(--ok-bg);color:var(--ok)} .alert.info{background:var(--info-bg);color:var(--info)}
.alert b{font-weight:650}

/* ---------- case workspace ---------- */
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper a{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:550;font-size:13px}
.stepper a i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--subtle);font-style:normal;font-size:12px;font-weight:700}
.stepper a.on{border-color:var(--brand);color:var(--text)} .stepper a.on i{background:var(--brand);color:#fff}
.stepper a.done i{background:var(--ok-bg);color:var(--ok)}
.stepper a.lock{opacity:.5;pointer-events:none}
.ws{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1180px){.ws{grid-template-columns:1fr}}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 8px;position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox [data-t]{cursor:pointer}
.chartbox [data-t]:hover .hit{fill:rgba(14,124,134,.07)}
.jawlbl{position:absolute;inset-inline-start:14px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
.vtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vtab{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);cursor:pointer;font-weight:600;font-size:13px}
.vtab.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.vtab .c{font-weight:500;color:var(--muted);font-size:12px}
.vtab .c.e{color:var(--err)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);padding:6px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.picker{display:flex;flex-direction:column;gap:10px}
.txlist{display:flex;flex-direction:column;gap:2px;max-height:380px;overflow:auto;margin:0 -4px;padding:0 4px}
.txcat{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 6px 4px}
.tx{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tx:hover{background:var(--subtle)}
.tx.on{background:var(--brand-soft);border-color:var(--brand)}
.tx i{width:12px;height:12px;border-radius:4px;flex:none}
.tx .p{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--subtle);font-size:13px}
.plan-v{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plan-v>.h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--subtle);font-weight:650;font-size:13px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.pitem .t{color:var(--muted);font-size:12px}
.pitem.new{box-shadow:inset 3px 0 0 var(--accent)}
.unsaved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);font-weight:600}
.unsaved:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.brush{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.brush .chip{justify-content:flex-start;border-radius:9px}

/* ---------- quote doc ---------- */
.docwrap{background:#E9EDF0;border-radius:var(--r-lg);padding:18px;overflow:auto}
.doc{--c1:#0E7C86;background:#fff;color:#1B2730;width:794px;max-width:100%;margin:0 auto;padding:44px 52px 40px;box-shadow:0 4px 24px rgba(0,0,0,.08);font-size:12px;line-height:1.55;position:relative;color-scheme:light}
.doc.fluid{width:auto;max-width:900px}
.doc h1{font-size:22px;color:var(--c1);margin-bottom:2px}
.doc h2{font-size:14px;color:var(--c1);margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid color-mix(in srgb,var(--c1) 25%,#fff)}
.doc h3{font-size:12.5px;margin:12px 0 6px}
.doc .dhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid #E3E8EC}
.doc .dlogo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px;color:var(--c1)}
.doc .dlogo i{width:34px;height:34px;border-radius:9px;background:var(--c1);display:grid;place-items:center;color:#fff;font-style:normal}
.doc .meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:11px;color:#55636D}
.doc .meta b{color:#1B2730;font-weight:600}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px}
.doc th{text-align:start;font-weight:650;color:#55636D;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #D7DEE3;padding:6px 6px}
.doc td{padding:6px 6px;border-bottom:1px solid #EEF1F3;vertical-align:top}
.doc .r{text-align:end;white-space:nowrap}
.doc .tot td{border-bottom:0;padding:3px 6px}
.doc .tot .g td{font-size:15px;font-weight:750;color:var(--c1);border-top:2px solid var(--c1);padding-top:8px}
.doc .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0}
.doc .opt{border:1px solid #D7DEE3;border-radius:10px;padding:12px;position:relative}
.doc .opt.rec{border-color:var(--c1);box-shadow:0 0 0 1px var(--c1)}
.doc .opt .p{font-size:18px;font-weight:750;color:var(--c1)}
.doc .opt .tag{position:absolute;top:-9px;inset-inline-end:10px;background:var(--c1);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.doc .vh{display:flex;align-items:center;gap:8px;font-weight:650;margin:14px 0 4px}
.doc .note{border-inline-start:3px solid var(--c1);background:#F5F8F9;padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.doc .tl{display:flex;align-items:center;gap:0;margin:8px 0 4px;flex-wrap:wrap}
.doc .tl .s{flex:1;min-width:110px;text-align:center;padding:8px;border-radius:10px;background:#F5F8F9;font-size:11px}
.doc .tl .g{flex:0 0 auto;padding:0 8px;font-size:10.5px;color:#7A8790;text-align:center}
.doc .wm{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.doc .wm span{font-size:110px;font-weight:800;color:rgba(180,35,24,.07);transform:rotate(-28deg);letter-spacing:.05em}
.doc .foot{margin-top:26px;padding-top:10px;border-top:1px solid #E3E8EC;font-size:10px;color:#7A8790;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.doc .chartwrap svg{width:100%;height:auto}
.doc .incl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:11.5px}
.doc .incl div:before{content:"✓ ";color:var(--c1);font-weight:700}

/* ---------- patient page ---------- */
.pp{min-height:100vh;background:#F3F6F7;color:#1B2730;color-scheme:light}
.pp .hero{background:var(--c1);color:#fff;padding:28px 20px 70px}
.pp .hero .in{max-width:900px;margin:0 auto}
.pp .body{max-width:900px;margin:-48px auto 0;padding:0 16px 80px;display:flex;flex-direction:column;gap:14px}
.pp .pc{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:20px}
.pp .cd{display:flex;gap:8px}
.pp .cd div{background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;text-align:center;min-width:54px}
.pp .cd b{display:block;font-size:20px}
.pp .sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid #E3E8EC;padding:12px 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.pp .ptabs{display:flex;gap:8px;flex-wrap:wrap}
.pp .ptabs button{flex:1;min-width:150px;border:1px solid #D7DEE3;background:#fff;border-radius:12px;padding:10px 12px;text-align:start;cursor:pointer}
.pp .ptabs button.on{border-color:var(--c1);box-shadow:0 0 0 1px var(--c1)}
.pp .ptabs .p{font-size:18px;font-weight:750;color:var(--c1)}
.prevbar{background:#102027;color:#fff;font-size:12.5px;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ---------- misc ---------- */
.lead-temp{font-size:15px}
.tlist{display:flex;flex-direction:column}
.titem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.titem:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;cursor:pointer;flex:none;background:var(--card)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.timeline{display:flex;flex-direction:column;gap:0;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.timeline .ev{position:relative;padding:0 0 14px 16px} [dir=rtl] .timeline .ev{padding:0 16px 14px 0}
.timeline .ev:before{content:"";position:absolute;inset-inline-start:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--brand)}
.prog{height:6px;background:var(--subtle);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:999px}
.mini-chart svg{width:100%;height:auto;display:block}
.fade-in{animation:fi .2s ease-out} @keyframes fi{from{opacity:0;transform:translateY(4px)}}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.week .day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:180px;padding:8px;display:flex;flex-direction:column;gap:6px}
.week .day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.week .ev{font-size:12px;padding:5px 7px;border-radius:7px;background:var(--subtle);border-inline-start:3px solid var(--brand)}
@media print{
  body{background:#fff}
  #root,.toasts,.noprint,.modal,.drawer,.scrim{display:none!important}
  #print{display:block!important}
  #print .doc{box-shadow:none;width:auto;padding:0;margin:0}
  #print .doc h2{break-after:avoid} #print .doc .pb{break-before:page}
  #print table,#print .chartwrap,#print .opt{break-inside:avoid}
  @page{size:A4;margin:14mm 14mm 16mm}
}
#print{display:none}
@media (max-width:640px){.chartbox{overflow-x:auto}.chartbox #cw{min-width:600px}#langSel{max-width:96px}.search{min-width:44px}}
@media (max-width:1180px){#prGrid,#rvGrid{grid-template-columns:1fr!important}#prGrid>div:last-child,#rvGrid>div:last-child{position:static!important}}
@media (max-width:900px){#ldGrid{grid-template-columns:1fr!important}}
.brush+.row{flex-wrap:wrap}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
[dir=rtl] .flip{transform:scaleX(-1)}
@media (max-width:640px){.hide-sm{display:none}}

const WORKFLOWS = [

  {on:"deal_created", task:"wf_travel", type:"general", prio:"med", dueH:24}
];
function runWorkflow(ev, ctx){
  WORKFLOWS.filter(w=>w.on===ev && (!w.status || w.status===ctx.status)).forEach(w=>{
    const l = lead(ctx.leadId); if(!l) return;
    S.tasks.unshift({id:uid("t"), title:w.task, tParams:{name:l.name}, type:w.type, prio:w.prio, due:now()+w.dueH*36e5, leadId:l.id, owner:l.owner||S.me, done:false, auto:true});
  });
}

      grp += `<rect class="hit" x="${x-1}" y="${up?18:occL-4}" width="${w+2}" height="${up?occU-14:240-occL}" rx="5" fill="${on?"rgba(14,124,134,.16)":pv?"rgba(245,158,11,.10)":"transparent"}" ${on?'stroke="#0E7C86" stroke-width="1.6"':pv?'stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="4 3"':""}/>`;
      grp += `<g transform="translate(${cx},${ty}) scale(${sx},${sy})${imp?` rotate(${up?-14:14})`:""}"${imp?' opacity=".8"':""}>${toothSVG(t, s, id)}</g>`;
      if(s.cekim){ const cy = up ? occU - ch*.5 : occL + ch*.5; if(!s.implant && !s.kron) grp += `<path d="M${cx-w*.32},${cy-9} L${cx+w*.32},${cy+9} M${cx+w*.32},${cy-9} L${cx-w*.32},${cy+9}" stroke="#C0392B" stroke-width="2.4" stroke-linecap="round"/>`; }
      if(s.other) grp += `<circle cx="${cx}" cy="${up?occU-ch*.5:occL+ch*.5}" r="7" fill="#fff" stroke="#64748B"/><text x="${cx}" y="${(up?occU-ch*.5:occL+ch*.5)+3.5}" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">?</text>`;
      if(opts.dots!==false && s.pv) grp += `<circle cx="${cx}" cy="${up?22:238}" r="3.6" fill="${vcol(s.pv)}"/>`;
      grp += `<text x="${cx}" y="${up?12:256}" text-anchor="middle" font-size="10" font-family="system-ui,sans-serif" fill="${on?"#0E7C86":"#5F6B70"}" font-weight="${on?700:500}">${toothLabel(t, sys)}</text></g>`;
      teethSvg += grp; x += w + gap;
    });
    const cejY = t => up ? occU - pos[t].ch : occL + pos[t].ch, dir = up ? 1 : -1, band = 34;
    const edge = up ? Math.min(...row.map(cejY)) - band : Math.max(...row.map(cejY)) + band;
    let gp = "", first = true;
    row.forEach((t,i)=>{ const p = pos[t], ce = cejY(t), s = st(t), flat = s.gone && !s.implant && !s.kron;
      const nx = i<row.length-1 ? pos[row[i+1]].x : p.x+p.w, papR = ce + dir*p.ch*(flat?.12:.3), xl = p.x - gap/2, xr = (p.x+p.w+nx)/2;
      if(first){ gp = `M${xl-4},${edge} L${xl-4},${ce+dir*p.ch*.3} L${xl},${ce+dir*p.ch*(flat?.12:.3)}`; first=false; }
      gp += flat ? ` L${xr},${papR}` : ` C${p.x+p.w*.18},${ce-dir*1.5} ${p.x+p.w*.82},${ce-dir*1.5} ${xr},${papR}`; });
    const lastP = pos[row[row.length-1]]; gp += ` L${lastP.x+lastP.w+4},${edge} Z`;
    const gum = `<path d="${gp}" fill="url(#${id}${up?"gu":"gl"})" pointer-events="none"/>`;
    // köprü konnektörleri
    let con = "";
    for(let i=0;i<row.length-1;i++){
      const a=row[i], b=row[i+1], sa=st(a), sb=st(b);
      if(!(sa.kron && sb.kron)) continue;
      const ka=crownKind(sa), kb=crownKind(sb); if(ka!=="pontic" && kb!=="pontic" && !(sa.span && sa.span===sb.span)) continue;
      const pa=pos[a], pb=pos[b], m = Math.min(pa.ch,pb.ch), mat = (ka==="pontic"?sa:sb).kron, fillc = (MAT[mat]||MAT.zr).g[2];
      const ya = up ? occU - m*.74 : occL + m*.2, yb = up ? occU - m*.2 : occL + m*.74, xa = pa.x+pa.w-6, xb = pb.x+6, xm=(xa+xb)/2, dp=(yb-ya)*.2;
      con += `<path d="M${xa},${ya} Q${xm},${ya+dp} ${xb},${ya} L${xb},${yb} Q${xm},${yb-dp} ${xa},${yb} Z" fill="${fillc}" pointer-events="none"/>`;

      const x0 = Math.min(...ts.map(t=>pos[t].x)) - 4, x1 = Math.max(...ts.map(t=>pos[t].x+pos[t].w)) + 4, mx = (x0+x1)/2, floor = 88, top = 50, gt = 60;
      sin += `<path d="M${x0},${floor} C${x0-4},${top+18} ${x0+10},${top} ${mx},${top} C${x1-10},${top} ${x1+4},${top+18} ${x1},${floor} Q${mx},${floor+10} ${x0},${floor} Z" fill="#EAF3F9" stroke="#7FB2D1" stroke-width="1.2" stroke-dasharray="4 2"/>`;
      sin += `<path d="M${x0+2},${gt+6} Q${mx},${gt-6} ${x1-2},${gt+6} L${x1},${floor} Q${mx},${floor+10} ${x0},${floor} Z" fill="url(#${id}gp)" stroke="#B08A4E" stroke-width="1.2"/>`;
    });
    if(up) [1,2].forEach(qd=>{
      const ts = row.filter(t=>quadOf(t)===qd && st(t).sinusSark && !st(t).sinus).sort((a,b)=>pos[a].x-pos[b].x); if(!ts.length) return;
      const x0 = pos[ts[0]].x - 6, x1 = pos[ts[ts.length-1]].x + pos[ts[ts.length-1]].w + 6, mx=(x0+x1)/2, top=40, lo = Math.min(...ts.map(cejY)) - 22;
      sark += `<path d="M${x0},${top+30} C${x0-2},${top+8} ${x0+12},${top} ${mx},${top} C${x1-12},${top} ${x1+2},${top+8} ${x1},${top+30} Q${mx},${lo+12} ${x0},${top+30} Z" fill="#DCEBF5" fill-opacity=".9" stroke="#5E97BD" stroke-width="1.2" stroke-dasharray="4 2"/>`;

      const x0 = pos[ts[0]].x - 3, x1 = pos[ts[ts.length-1]].x + pos[ts[ts.length-1]].w + 3, ce = Math.max(...ts.map(cejY)), crest = ce + 14, canal = ce + 39, xm=(x0+x1)/2;
      kem += `<rect x="${x0}" y="${ce+2}" width="${x1-x0}" height="${crest-ce-2}" fill="url(#${id}hatch)" opacity=".75"/>`;
      kem += `<path d="M${x0-6},${canal-5} Q${xm},${canal} ${x1+6},${canal-5} L${x1+6},${canal+5} Q${xm},${canal+10} ${x0-6},${canal+5} Z" fill="#F6E7A8" fill-opacity=".95" stroke="#C9A227" stroke-width="1"/>`;
    });
    row.forEach(t=>{ if(!st(t).greft) return; const p=pos[t], ce=cejY(t), y0 = up ? ce-48 : ce+4, y1 = up ? ce-4 : ce+48;
      gr += `<rect x="${p.x-1}" y="${y0}" width="${p.w+2}" height="${y1-y0}" rx="${Math.min(10,p.w*.4)}" fill="url(#${id}gp)" fill-opacity=".62" stroke="#B08A4E" stroke-width="1" stroke-dasharray="2.5 2" pointer-events="none"/>`; });
    out += sark + sin + con + teethSvg + gum + gr + kem;
  };
  drawRow(UPPER, true); drawRow(LOWER, false);
  // span etiketleri (köprü, tam çene protez, paket)
  (opts.spans||[]).forEach(sp=>{
    const ts = sp.teeth.filter(t=>posAll[t]); if(!ts.length) return;
    const up = ts[0] < 30, x0 = Math.min(...ts.map(t=>posAll[t].x)), x1 = Math.max(...ts.map(t=>posAll[t].x+posAll[t].w));
    const y = up ? -2 : 264, ty = up ? -10 : 280, col = sp.color || "#0E7C86";
    out += `<path d="M${x0},${y+(up?5:-5)} L${x0},${y} L${x1},${y} L${x1},${y+(up?5:-5)}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>`;
    const lbl = esc(sp.label), tw = Math.min(x1-x0, lbl.length*5.6+16), mx = (x0+x1)/2;
    out += `<rect x="${mx-tw/2}" y="${ty-9}" width="${tw}" height="13" rx="6.5" fill="${col}"/><text x="${mx}" y="${ty+.5}" text-anchor="middle" font-size="8.6" font-weight="650" font-family="system-ui,sans-serif" fill="#fff">${lbl.length*5.6+16>x1-x0 ? lbl.slice(0,Math.max(4,Math.floor((x1-x0-16)/5.6)))+"…" : lbl}</text>`;
  });
  return out + `</svg>`;
}

/* lejant */
function legendHTML(states, spans){
  const used = new Set();
  Object.values(states).forEach(s=>{
    if(s.cekim) used.add("cekim"); if(s.implant) used.add("implant"); const k = crownKind(s);
    if(k==="pontic") used.add("pontic"); if(s.kron) used.add("m_"+s.kron); if(s.gone && !s.implant && !s.kron) used.add("eksik");
    if(s.dolgu) used.add("f_"+s.dolgu); if(s.kanal) used.add("kanal"); if(s.sinus) used.add("sinus"); if(s.greft) used.add("greft");
    if(s.sinusSark) used.add("sinusSark"); if(s.kemikAz) used.add("kemikAz"); if(s.veneer) used.add("veneer"); if(s.caries) used.add("caries");
    if(s.rootOnly) used.add("rootOnly"); if(s.impacted) used.add("impacted");
  });
  const sw = {
    cekim:`<i style="background:#C0392B;border-radius:50%"></i>`, implant:`<i style="background:#B9C2C6;border:1px solid #6F7C82;width:6px"></i>`,
    pontic:`<i style="background:linear-gradient(#D3E3EE,#fff);border:1px dashed #AFC8D8"></i>`, eksik:`<i style="background:#fff;border:1.2px dashed #9AA3A7"></i>`,
    kanal:`<i style="background:#C0392B;height:3px"></i>`, sinus:`<i style="background:#EFDDBB;border:1.2px solid #B08A4E"></i>`, greft:`<i style="background:#EFDDBB;border:1.2px dotted #B08A4E"></i>`,
    sinusSark:`<i style="background:#DCEBF5;border:1.2px dashed #5E97BD"></i>`, kemikAz:`<i style="background:repeating-linear-gradient(45deg,#E4E7E8 0 3px,#fff 3px 6px);border-bottom:2px solid #D4A017"></i>`,
    veneer:`<i style="background:#F3E3EE;border:1px solid #CDA6C1"></i>`, caries:`<i style="background:#5B3A1E"></i>`, rootOnly:`<i style="background:#C79B6B"></i>`, impacted:`<i style="background:#EDE3CE;border:1px dashed #A8946E"></i>`
  };
  const keys = [...used];
  return keys.map(k=>{
    let s = sw[k];
    if(k.startsWith("m_")){ const m = MAT[k.slice(2)]; s = `<i style="background:linear-gradient(${m.g[0]},${m.g[2]});border:1px solid ${m.s}"></i>`; }
    if(k.startsWith("f_")){ const c = {comp:"#8DB3CF",amalg:"#7B8489",inlay:"#C7B3E3",plan:"#7FA7C4"}[k.slice(2)]; s = `<i style="background:${c}"></i>`; }
    return `<span>${s}${esc(t("lg_"+k))}</span>`;
  }).join("");

/* =====================================================================
   ENGINE — plan genişletme, durum hesaplama, kural motoru, fiyatlandırma
   ===================================================================== */
const CROWN_GROUP = ["crown_zr","crown_emax","crown_pfm","crown_por"];
const SURGICAL = ["ext","implant","sinus","graft"];
const POSTERIOR_UP = [14,15,16,17,24,25,26,27];

function txName(id, lang){ const x = tx(id); return x ? tn(x.n, lang) : id; }
function itemName(it, lang){ if(it.b){ const b = bundle(it.b); return b ? tn(b.n, lang) : it.b; } if(it.manual) return it.name; return txName(it.tx, lang); }
const IMP_BASE = 450, BUNDLE_SWAP = [["smile_zr_u","smile_emax_u"]];
function brandOf(it){
  if(it.b){ const b = bundle(it.b); if(!b || !it.brand) return null; if(b.brands) return b.brands.find(x=>x.id===it.brand) || null; if(b.imp.length) return (tx("implant").brands||[]).find(x=>x.id===it.brand) || null; return null; }
  const x = it.tx && tx(it.tx); return x && x.brands ? (x.brands.find(b=>b.id===it.brand) || null) : null; }
function brandList(it){ if(it.b){ const b = bundle(it.b); if(!b) return null; if(b.brands) return b.brands; if(b.imp.length) return tx("implant").brands; return null; } const x = it.tx && tx(it.tx); return x && x.brands || null; }
function implantForm(it){ const b = brandOf(it); return (b && b.form) || "std"; }

/* Plan kalemlerini diş/çene olaylarına açar — paketler bileşenlerine açılır */
function expand(items){
  const teeth = [], arch = [];
  (items||[]).forEach(it=>{
    if(it.b){
      const b = bundle(it.b); if(!b) return;
      const bf = (b.imp.length && !b.brands && brandOf(it) && brandOf(it).form) || "std"; b.imp.forEach(t=> teeth.push({t, txId:"implant", render:"implant", form:bf, v:it.v, it, viaBundle:true}));
      b.crown.forEach(t=> teeth.push({t, txId:"bundle_crown", render:"crown", mat:b.mat, v:it.v, it, span:it.id, viaBundle:true}));
      if(b.arch) arch.push({jaw:b.jaw, txId:b.arch, v:it.v, it});
      return;
    }
    const x = tx(it.tx); if(!x) return;
    if(x.unit==="arch"){ (it.jaws||[]).forEach(j=>arch.push({jaw:j, txId:x.id, v:it.v, it})); return; }
    if(x.unit==="tooth" || x.unit==="side") (it.teeth||[]).forEach(t=> teeth.push({t, txId:x.id, render:x.render, mat:x.mat, form:x.render==="implant"?implantForm(it):null, v:it.v, it}));
  });
  return {teeth, arch};
}

/* Mevcut durum → çizim durumu */
function sitRender(e){
  const s = {}; if(!e) return s;
  switch(e.s){
    case "missing": s.gone = true; break;
    case "root": s.rootOnly = true; break;
    case "rct": s.kanal = true; break;
    case "crown": case "bridge": s.kron = "old"; break;
    case "pontic": s.gone = true; s.kron = "old"; break;
    case "caries": s.caries = true; break;
    case "comp": s.dolgu = "comp"; break;
    case "amalg": s.dolgu = "amalg"; break;
    case "inlay": s.dolgu = "inlay"; break;
    case "impab": s.implant = "std"; s.gone = true; break;
    case "impcr": s.implant = "std"; s.gone = true; s.kron = "old"; break;
    case "impacted": s.impacted = true; break;
    case "veneer": s.veneer = "por"; break;
    case "other": s.other = true; break;
  }
  if(e.f){ if(e.f.sinusSark) s.sinusSark = true; if(e.f.kemikAz) s.kemikAz = true; }
  return s;
}
function toothStates(src, mode, items, upto){
  const out = {}, sit = src.situation || {};
  ALL_TEETH.forEach(t=> out[t] = sitRender(sit[t]));
  if(mode==="sit") return out;
  const ex = expand(items || src.items);
  ex.teeth.filter(e=>!upto || e.v<=upto).sort((a,b)=>a.v-b.v).forEach(e=>{
    const s = out[e.t];
    s.pv = s.pv ? Math.min(s.pv, e.v) : e.v;
    switch(e.render){
      case "ext":
        s.cekim = true; s.gone = true; delete s.rootOnly; delete s.dolgu; delete s.kanal; delete s.caries; delete s.veneer; delete s.impacted;
        if(s.kron==="old") delete s.kron; if(e.txId==="implant_rem") delete s.implant; break;
      case "implant": s.implant = e.form || "std"; s.gone = true; delete s.rootOnly; delete s.impacted; if(s.kron==="old") delete s.kron; break;
      case "crown": s.kron = e.mat || "zr"; if(e.span) s.span = e.span; delete s.veneer; delete s.caries; break;
      case "veneer": s.veneer = e.mat || "por"; break;
      case "fill": s.dolgu = "plan"; delete s.caries; break;
      case "inlay": s.dolgu = "inlay"; delete s.caries; break;
      case "rct": s.kanal = true; break;
      case "graft": s.greft = true; break;
      case "sinus": s.sinus = true; break;
    }
  });
  return out;
}
function implantsInJaw(sit, items, jaw, beforeV){
  let n = 0;
  Object.entries(sit||{}).forEach(([t,e])=>{ if(jawOf(+t)===jaw && (e.s==="impab"||e.s==="impcr")) n++; });
  expand(items).teeth.forEach(e=>{ if(e.render==="implant" && jawOf(e.t)===jaw && (beforeV==null || e.v<beforeV)) n++; });
  return n;
}
function spansFor(src, items, lang){
  const sp = [], sit = src.situation||{};
  (items||[]).forEach(it=>{
    if(it.b){ const b = bundle(it.b); if(!b) return;
      if(b.crown.length){ const ts = b.crown.slice().sort((a,c)=>ALL_TEETH.indexOf(a)-ALL_TEETH.indexOf(c));
        sp.push({teeth:b.crown, color:vcol(it.v), label:`${tn(b.n,lang).replace(/\s*\(.*\)/,"")} ${ts[0]}–${ts[ts.length-1]} · ${t("implants_n",{n:implantsInJaw(sit, items, b.jaw)}, lang)}`}); }
      if(b.arch) sp.push({teeth:b.jaw==="u"?UPPER:LOWER, color:vcol(it.v), label:`${tn(b.n,lang)}`});
      return; }
    const x = tx(it.tx); if(x && x.unit==="arch") (it.jaws||[]).forEach(j=> sp.push({teeth:j==="u"?UPPER:LOWER, color:vcol(it.v), label:`${tn(x.n,lang)} · ${t(j==="u"?"jaw_u":"jaw_l",null,lang)}`}));
  });
  // aynı çenede çakışan etiketleri birleştir
  const seen = {}; return sp.filter(s=>{ const k = s.teeth[0]+"|"+s.label; if(seen[k]) return false; seen[k]=1; return true; }).slice(0,4);
}

/* ---------------- KURAL MOTORU ---------------- */
function checkRules(c, items){
  items = items || c.items;
  const R = [], on = k => S.catalog.rules[k] !== false, l = lead(c.leadId) || {}, med = l.med || {};
  const ex = expand(items), byT = {};
  ex.teeth.forEach(e=> (byT[e.t] = byT[e.t]||[]).push(e));
  const has = (t,r) => (byT[t]||[]).some(e=>e.render===r);
  const push = (sev, code, p, v) => R.push({sev, code, p:p||{}, v});
  const sit = c.situation || {};
  // --- engelleyici (her zaman) ---
  const B = {B1:[],B3:[],B4:[],B5:[]};
  Object.keys(byT).forEach(k=>{ const tt = +k;
    if(has(tt,"ext") && has(tt,"rct")) B.B1.push(tt);
    if(has(tt,"implant") && has(tt,"rct")) B.B3.push(tt);
    if(has(tt,"veneer") && has(tt,"crown")) B.B4.push(tt);
    if((has(tt,"implant") || ["impab","impcr"].includes((sit[tt]||{}).s)) && has(tt,"veneer")) B.B5.push(tt);
  });
  Object.entries(B).forEach(([k,v])=>{ if(v.length) push("block", k, {teeth:v.join(", ")}); });
  const sinusT = ex.teeth.filter(e=>e.render==="sinus");
  const low = sinusT.filter(e=>jawOf(e.t)==="l").map(e=>e.t); if(low.length) push("block","C1",{teeth:low.join(", ")});
  const ant = sinusT.filter(e=>jawOf(e.t)==="u" && !POSTERIOR_UP.includes(e.t)).map(e=>e.t); if(ant.length) push("block","C1b",{teeth:ant.join(", ")});
  for(let v=1; v<=c.visits; v++) if(!items.some(i=>i.v===v)) push("block","EMPTY",{v},v);
  items.forEach(it=>{
    if(it.b){ const b = bundle(it.b); if(b && b.minVisits > c.visits) push("block","MINV",{name:tn(b.n), need:b.minVisits, have:c.visits}, it.v);
      if(b && !b.visits.includes(it.v)) push("warn","VISIT",{name:tn(b.n), v:it.v, ok:b.visits.join("/")}, it.v); }
    else { const x = tx(it.tx); if(x && !x.visits.includes(it.v) && !it.manual) push("warn","VISIT",{name:tn(x.n), v:it.v, ok:x.visits.join("/")}, it.v); }
  });
  // --- uyarılar (açılıp kapanabilir) ---
  const finalS = toothStates(c, "plan", items);
  if(on("B6")){ const bad = ex.teeth.filter(e=>{ const x = tx(e.txId); return x && x.needsImplant && !finalS[e.t].implant; }).map(e=>e.t); if(bad.length) push("warn","B6",{teeth:[...new Set(bad)].join(", ")}); }
  if(on("BRIDGE")) [UPPER, LOWER].forEach(row=>{
    let i = 0;
    while(i<row.length){
      const s = finalS[row[i]];
      if(crownKind(s)==="pontic" && !s.span){
        let j = i; while(j<row.length && crownKind(finalS[row[j]])==="pontic" && !finalS[row[j]].span) j++;
        const L = i>0 ? finalS[row[i-1]] : null, Rr = j<row.length ? finalS[row[j]] : null;
        const ok = x => x && x.kron && crownKind(x)!=="pontic";
        if(!ok(L) || !ok(Rr)) push("warn","BRIDGE",{teeth:row.slice(i,j).join(", ")});
        i = j;
      } else i++;
    }
  });
  if(on("SINUS_NOIMP")) [1,2].forEach(q=>{ if(sinusT.some(e=>quadOf(e.t)===q) && !ALL_TEETH.some(tt=>quadOf(tt)===q && finalS[tt].implant)) push("warn","SINUS_NOIMP",{q}); });
  if(on("SINUS_LOW")) [1,2].forEach(q=>{ const imp = ex.teeth.filter(e=>e.render==="implant" && quadOf(e.t)===q && POSTERIOR_UP.includes(e.t) && (sit[e.t]||{}).f && sit[e.t].f.sinusSark);
    if(imp.length && !sinusT.some(e=>quadOf(e.t)===q)) push("warn","SINUS_LOW",{teeth:imp.map(e=>e.t).join(", ")}); });
  if(on("BONE")){ const bad = ex.teeth.filter(e=>e.render==="implant" && (sit[e.t]||{}).f && sit[e.t].f.kemikAz && e.form!=="short" && !has(e.t,"graft")).map(e=>e.t); if(bad.length) push("warn","BONE",{teeth:bad.join(", ")}); }
  if(on("E1")){ const bad = ex.teeth.filter(e=>e.txId==="implant" && (byT[e.t]||[]).some(o=>o.render==="ext" && o.v===e.v)).map(e=>e.t); if(bad.length) push("info","E1",{teeth:bad.join(", ")}); }
  if(on("PRESENT")){ const bad = ex.teeth.filter(e=>e.render==="implant" && !finalS[e.t].cekim && (!sit[e.t] || ["intact","rct","crown","caries","comp","amalg","inlay","veneer","bridge","other"].includes(sit[e.t].s))).map(e=>e.t); if(bad.length) push("warn","PRESENT",{teeth:bad.join(", ")}); }
  if(on("D1")){ const wv = items.filter(i=>i.tx==="whitening").map(i=>i.v), cv = ex.teeth.filter(e=>e.render==="crown"||e.render==="veneer").map(e=>e.v); if(wv.length && cv.length && Math.max(...wv) > Math.min(...cv)) push("warn","D1",{}); }
  if(on("PREREQ")){
    items.forEach(it=>{
      const pr = it.b ? (bundle(it.b)||{}).prereq : (tx(it.tx)||{}).prereq; if(!pr) return;
      const jaws = it.b ? [bundle(it.b).jaw] : (it.jaws||[]);
      jaws.forEach(j=>{ const have = implantsInJaw(sit, items, j, it.v); if(have < pr.count) push("warn","PREREQ",{name:itemName(it), need:pr.count, have, jaw:t(j==="u"?"jaw_u":"jaw_l")}, it.v); });
    });
  }
  const R_ = r => ex.teeth.some(e=>r.includes(e.render));
  const age = +l.age || 0;
  if(on("M1") && age && age<18 && R_(["implant"])) push("warn","M1",{age});
  if(on("M2") && med.bisph && R_(["implant","ext"])) push("warn","M2",{});
  if(on("M3") && med.anticoag && R_(["ext","implant","sinus","graft"])) push("warn","M3",{});
  if(on("M4") && med.diabetes && R_(["implant"])) push("warn","M4",{});
  if(on("M5") && med.chemo && R_(SURGICAL)) push("warn","M5",{});
  if(on("M6") && med.pregnant && R_(SURGICAL)) push("warn","M6",{});
  return R;
}

function suggestPlan(c){
  const sit = c.situation || {}, items = [];
  const it = (v,txId,teeth,o) => items.push(Object.assign({id:uid("i"), v, tx:txId, teeth}, o||{}));
  const bad = s => s && ["missing","root","pontic"].includes(s.s);
  ["u","l"].forEach(j=>{
    const row = j==="u" ? UPPER : LOWER, core = row.filter(t=>t%10!==8);
    const lost = core.filter(t=>bad(sit[t]));
    if(lost.length >= 8){
      const toExt = core.filter(t=>sit[t] && sit[t].s==="root").concat(core.filter(t=>!sit[t] || ["intact","caries","rct","crown","comp","amalg"].includes((sit[t]||{}).s)));
      if(toExt.length) it(1,"ext_simple",toExt);
      items.push({id:uid("i"), v:1, b:j==="u"?"ao4_u":"ao4_l", teeth:bundle(j==="u"?"ao4_u":"ao4_l").teeth});
      it(1,"temp_rem",[],{jaws:[j]});
      items.push({id:uid("i"), v:2, b:j==="u"?"fp_u":"fp_l", teeth:bundle(j==="u"?"fp_u":"fp_l").teeth});
      return;
    }
    const roots = core.filter(t=>sit[t] && sit[t].s==="root"), miss = core.filter(t=>sit[t] && sit[t].s==="missing");
    if(roots.length) it(1,"ext_simple",roots);
    const imp = [...roots, ...miss];
    if(imp.length){ it(1,"implant",imp,{brand:"b_neod"}); it(2,"crown_imp",imp);
      const bone = imp.filter(t=>sit[t] && sit[t].f && sit[t].f.kemikAz); if(bone.length) it(1,"graft",bone,{brand:"g1"});
      [1,2].forEach(q=>{ const ts = imp.filter(t=>quadOf(t)===q && POSTERIOR_UP.includes(t) && sit[t] && sit[t].f && sit[t].f.sinusSark); if(ts.length) it(1,"sinus_open",[ts[0]]); });
    }
  });
  const car = ALL_TEETH.filter(t=>sit[t] && sit[t].s==="caries"); if(car.length) it(1,"filling",car);
  if(!items.length) it(1,"consult",[],{qty:1});
  else it(1,"pano",[],{qty:1});
  return items;
}

const CUR_OF = {GB:"GBP",IE:"EUR",US:"USD",SA:"SAR",AE:"AED",TR:"TRY",AU:"USD"};
function convert(eur, cur){ const v = eur * ((S.clinic.fx||{})[cur] || 1); const step = cur==="TRY" ? 50 : v>=1000 ? 10 : 5; return Math.round(v/step)*step; }
function roundTo(v, step){ return step>0 ? Math.round(v/step)*step : Math.round(v); }
function curStep(cur){ return cur==="TRY" ? S.clinic.rounding*10 : S.clinic.rounding; }
function unitEUR(it){ if(it.manual) return null; if(it.b){ const b = bundle(it.b); if(!b) return 0; const br = brandOf(it); if(br && b.brands) return br.price; return b.price + (br ? (br.price-IMP_BASE)*b.imp.length : 0); } const b = brandOf(it); if(b) return b.price; const x = tx(it.tx); return x ? x.price : 0; }
function qtyOf(it){
  if(it.b) return 1; if(it.manual) return it.qty||1;
  const x = tx(it.tx); if(!x) return 1;
  if(x.unit==="tooth") return (it.teeth||[]).length || 1;
  if(x.unit==="side") return new Set((it.teeth||[]).map(quadOf)).size || 1;
  if(x.unit==="arch") return (it.jaws||[]).length || 1;
  return it.qty || 1;
}
function unitLabel(it, lang){ if(it.b) return t("u_pkg",null,lang); if(it.manual) return t("u_piece",null,lang); const x = tx(it.tx); return t("u_"+(x?x.unit:"piece"),null,lang); }
function calcOption(c, op, cur, lang){
  const vmap = {}, lines = [];
  const all = [...(op.items||[]), ...(op.extras||[])];
  all.forEach(it=>{
    if(!it.v) return;
    const key = it.v+"|"+(it.b||it.tx||("m:"+it.name))+"|"+(it.brand||"")+"|"+(it.manual?it.id:"");
    const unit = it.manual ? (+it.price||0) : convert(unitEUR(it), cur);
    let L = vmap[key];
    if(!L){ L = vmap[key] = {v:it.v, txId:it.tx||null, b:it.b||null, brand:it.brand||null, manual:!!it.manual, nm:itemName(it, lang), br:(brandOf(it)||{}).n||"", unitL:unitLabel(it, lang), teeth:[], qty:0, unit, total:0, jaws:[]}; lines.push(L); }
    L.qty += qtyOf(it); (it.teeth||[]).forEach(t=>{ if(!L.teeth.includes(t)) L.teeth.push(t); }); (it.jaws||[]).forEach(j=>{ if(!L.jaws.includes(j)) L.jaws.push(j); });
    L.total = L.qty * L.unit;
  });
  const order = {ext:0,sinus:1,graft:2,implant:3,rct:4,fill:5,inlay:5,none:6,arch:7,crown:8,veneer:9};
  lines.sort((a,b)=> a.v-b.v || ((order[(tx(a.txId)||{}).render]??(a.b?3.5:6)) - (order[(tx(b.txId)||{}).render]??(b.b?3.5:6))));
  const nV = Math.max(c.visits||1, ...lines.map(l=>l.v), 1);
  const visits = []; for(let v=1; v<=nV; v++){ const ls = lines.filter(l=>l.v===v); visits.push({v, lines:ls, sub:ls.reduce((a,l)=>a+l.total,0)}); }
  // kron kademe paketi
  let tierAdj = 0, tierInfo = null;
  S.catalog.tx.filter(x=>x.tiers).forEach(x=>{
    const ls = lines.filter(l=>l.txId===x.id), q = ls.reduce((a,l)=>a+l.qty,0); if(!q) return;
    const unit = ls[0].unit, plain = q*unit; let best = plain, bn = 0;
    x.tiers.forEach(([n,p])=>{ if(q>=n){ const v = convert(p,cur) + (q-n)*unit; if(v<best){ best=v; bn=n; } } });
    if(best<plain){ tierAdj += plain-best; tierInfo = {n:bn, q, name:tn(x.n,lang)}; }
  });
  // paket (otel, transfer)
  const pkg = [];
  const hotelN = (op.hotel && +op.hotel.n) || 0;
  if(hotelN) pkg.push({k:"hotel", nm:t("pk_hotel",{n:hotelN},lang), total: op.hotel.free ? 0 : hotelN*convert(S.clinic.hotelNight,cur), free:!!op.hotel.free});
  if(op.transfer && op.transfer.on) pkg.push({k:"transfer", nm:t("pk_transfer",null,lang), total: op.transfer.free ? 0 : convert(S.clinic.transfer,cur)*nV, free:!!op.transfer.free});
  const pkgSum = pkg.reduce((a,p)=>a+p.total,0);
  const sub = lines.reduce((a,l)=>a+l.total,0) + pkgSum;
  const discPct = +op.disc || 0;
  const disc = Math.round((sub - tierAdj) * discPct / 100);
  const net = sub - tierAdj - disc;
  const step = curStep(cur), total = Math.max(0, roundTo(net, step)), rnd = total - net;
  const deposit = roundTo(total * ((c.pricing && c.pricing.deposit) ?? S.clinic.deposit) / 100, step);
  const share = visits.map((vv,i)=> vv.sub + (i===0 ? pkgSum : 0));
  const base = share.reduce((a,b)=>a+b,0) || 1;
  const pay = visits.map((vv,i)=>({v:vv.v, amount: roundTo(total*share[i]/base, step)}));
  const diff = total - pay.reduce((a,p)=>a+p.amount,0); if(pay.length) pay[pay.length-1].amount += diff;
  if(pay.length){ pay[0].amount -= deposit; }
  const missing = lines.filter(l=>l.manual && !l.unit).length;
  return {visits, lines, sub, tierAdj, tierInfo, pkg, discPct, disc, rnd, total, deposit, pay, missing, cur};
}

const I = (n, cls) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ic${cls?" "+cls:""}">${IC[n]||""}</svg>`;

/* ---------- format ---------- */
const LOC = {tr:"tr-TR", en:"en-GB", de:"de-DE", ar:"ar-u-nu-latn"};
const L_ = () => S.ui.lang;
const fmtMoney = (v, cur, lang) => { try{ return new Intl.NumberFormat(LOC[lang||L_()], {style:"currency", currency:cur||S.clinic.cur, maximumFractionDigits:0}).format(v||0); }catch(e){ return (v||0)+" "+cur; } };
const fmtDate = (ts, lang, o) => ts ? new Intl.DateTimeFormat(LOC[lang||L_()], o||{day:"numeric", month:"short", year:"numeric"}).format(new Date(ts)) : "—";
const fmtDT = ts => fmtDate(ts, null, {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
function rel(ts){ const d = (ts - now())/1000, a = Math.abs(d), rtf = new Intl.RelativeTimeFormat(LOC[L_()], {numeric:"auto"});
  if(a<60) return rtf.format(Math.round(d),"second"); if(a<3600) return rtf.format(Math.round(d/60),"minute"); if(a<86400) return rtf.format(Math.round(d/3600),"hour"); if(a<86400*30) return rtf.format(Math.round(d/86400),"day"); return fmtDate(ts); }
const money = (v, cur) => can("money") ? fmtMoney(v, cur) : "•••";
const flag = c => COUNTRIES[c] || "🌐";
const av = (uidOrName, sm) => { const u = user(uidOrName); const n = u ? u.name : uidOrName; return `<span class="av${sm?" sm":""}" style="background:${avColor(n)}" title="${esc(n)}">${esc(initials(n))}</span>`; };
const stBadge = s => `<span class="bdg" style="background:color-mix(in srgb,${LEAD_ST_COL[s]} 14%,transparent);color:${LEAD_ST_COL[s]}"><span class="dot" style="background:${LEAD_ST_COL[s]}"></span>${esc(t("st_"+s))}</span>`;
const tempIc = tp => `<span class="lead-temp" title="${esc(t("temp_"+tp))}">${{hot:"🔥",warm:"🌤️",cold:"❄️"}[tp]||""}</span>`;
const qBadge = s => `<span class="bdg ${({sent:"info",viewed:"brand",accepted:"ok",changes:"warn",declined:"err",superseded:"",approval:"warn",draft:""})[s]||""}">${esc(t("qs_"+s))}</span>`;
const taskTitle = tk => tk.title && tk.title.startsWith("wf_") ? t(tk.title, tk.tParams) : tk.title;

/* ---------- overlays ---------- */
let overlay = null;
function closeOverlay(){ if(overlay){ overlay.forEach(e=>e.remove()); overlay = null; } }
function openDrawer(title, body, foot, onMount){
  closeOverlay();
  const sc = document.createElement("div"); sc.className = "scrim"; sc.onclick = closeOverlay;
  const d = document.createElement("div"); d.className = "drawer"; d.setAttribute("role","dialog");
  d.innerHTML = `<div class="hd"><h2 class="grow">${title}</h2><button class="btn ghost icon" data-act="close">${I("x")}</button></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:""}`;
  document.body.append(sc, d); overlay = [sc, d];
  bindActions(d); if(onMount) onMount(d);
  const f = d.querySelector("input,select,textarea"); if(f) setTimeout(()=>f.focus(), 30);
  return d;
}
function openModal(html, onMount){
  closeOverlay();
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="scrim" style="position:absolute"></div><div class="box" role="dialog" style="position:relative">${html}</div>`;
  m.firstChild.onclick = closeOverlay;
  document.body.append(m); overlay = [m]; bindActions(m); if(onMount) onMount(m);
  return m;
}
function confirmBox(title, text, okLabel, danger){
  return new Promise(res=>{
    const m = openModal(`<div class="hd"><div class="grow"><h2>${title}</h2><p class="muted" style="margin:6px 0 0">${text||""}</p></div></div><div class="ft"><button class="btn" data-x="0">${t("cancel")}</button><button class="btn ${danger?"danger":"pri"}" data-x="1">${okLabel||t("ok")}</button></div>`);
    m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ closeOverlay(); res(b.dataset.x==="1"); });
  });
}
function toast(msg, undoFn){
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `${I("ok")}<span>${msg}</span>${undoFn?`<button>${t("undo")}</button>`:""}`;
  if(undoFn) el.querySelector("button").onclick = ()=>{ undoFn(); el.remove(); };
  document.getElementById("toasts").append(el); setTimeout(()=>el.remove(), 3800);
}
async function copyText(s){ try{ await navigator.clipboard.writeText(s); toast(t("copied")); }catch(e){ const ta = document.createElement("textarea"); ta.value = s; document.body.append(ta); ta.select(); try{ document.execCommand("copy"); toast(t("copied")); }catch(_){} ta.remove(); } }

/* ---------- actions ---------- */
const ACT = {};
function bindActions(scope){
  scope.addEventListener("click", e=>{
    const el = e.target.closest("[data-act]"); if(!el || !scope.contains(el)) return;
    const fn = ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el, e); }
  });
}
ACT.close = closeOverlay;
ACT.go = el => { location.hash = el.dataset.to; };

const endOfDay = () => { const d = new Date(); d.setHours(23,59,59,999); return d.getTime(); };
function shellHTML(active){

      <div class="search">${I("search")}<input id="gsearch" placeholder="${t("search_ph")}" autocomplete="off"><span class="kbd">/</span><div class="sres hide" id="sres"></div></div>
      <div class="grow"></div>
      <select class="inp sm" id="langSel" style="width:auto" aria-label="language">${LANGS.map(l=>`<option value="${l}" ${l===L_()?"selected":""}>${LANG_NAMES[l]}</option>`).join("")}</select>

ACT.burger = () => { const s = document.getElementById("side"); s.classList.toggle("open"); if(s.classList.contains("open")){ const sc = document.createElement("div"); sc.className="scrim"; sc.style.zIndex=29; sc.onclick=()=>{ s.classList.remove("open"); sc.remove(); }; document.body.append(sc); } };

function applyTheme(){ const r = document.documentElement; if(S.ui.theme==="auto") delete r.dataset.theme; else r.dataset.theme = S.ui.theme; r.style.setProperty("--brand", S.clinic.color); r.style.setProperty("--brand-soft", `color-mix(in srgb, ${S.clinic.color} 13%, var(--card))`); r.lang = L_(); r.dir = L_()==="ar" ? "rtl" : "ltr"; }

function wireShell(){
  const rs = document.getElementById("roleSel"); if(rs) rs.onchange = () => { S.me = rs.value; save(); toast(t("viewing_as",{r:t("role_"+me().role)})); route(); };
  const ls = document.getElementById("langSel"); if(ls) ls.onchange = () => { S.ui.lang = ls.value; applyTheme(); save(); route(); };
  const gs = document.getElementById("gsearch"), sr = document.getElementById("sres");
  if(gs){
    let idx = 0;
    const draw = () => { const q = gs.value.trim().toLowerCase(); if(!q){ sr.classList.add("hide"); return; }
      const res = S.leads.filter(l=>(l.name+" "+l.phone+" "+(l.email||"")).toLowerCase().includes(q)).slice(0,7);
      sr.innerHTML = res.length ? res.map((l,i)=>`<a href="#/lead/${l.id}" class="${i===idx?"on":""}">${av(l.name,1)}<span class="grow">${esc(l.name)}<div class="tiny muted">${flag(l.country)} ${esc(l.phone)}</div></span>${stBadge(l.status)}</a>`).join("") : `<div class="empty small">${t("no_results")}</div>`;
      sr.classList.remove("hide"); };
    gs.oninput = () => { idx = 0; draw(); };
    gs.onkeydown = e => { const a = sr.querySelectorAll("a"); if(e.key==="ArrowDown"){ idx = Math.min(idx+1, a.length-1); draw(); e.preventDefault(); } if(e.key==="ArrowUp"){ idx = Math.max(idx-1,0); draw(); e.preventDefault(); } if(e.key==="Enter" && a[idx]){ location.hash = a[idx].getAttribute("href"); gs.value=""; sr.classList.add("hide"); } if(e.key==="Escape"){ gs.value=""; sr.classList.add("hide"); gs.blur(); } };
    gs.onblur = () => setTimeout(()=>sr.classList.add("hide"), 150);
  }
}

function pageHead(title, sub, actions){ return `<div class="phead"><div class="grow"><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>${actions?`<div class="row wrap">${actions}</div>`:""}</div>`; }
function emptyBox(ic, text, btn){ return `<div class="empty">${I(ic)}<div>${text}</div>${btn?`<div style="margin-top:12px">${btn}</div>`:""}</div>`; }

/* ---------- DASHBOARD ---------- */
function viewDash(){
  const u = me(), h = new Date().getHours();
  const greet = t(h<12?"gm":h<18?"ga":"ge", {name:u.name.split(" ")[0].replace("Dr.","").trim() || u.name});
  const d7 = now()-7*DAY, m0 = new Date(); m0.setDate(1); m0.setHours(0,0,0,0);
  const newLeads = S.leads.filter(l=>l.created>d7).length;
  const pool = S.cases.filter(c=>c.status==="pool").length;
  const sent = S.quotes.filter(q=>q.created>now()-30*DAY && q.status!=="superseded").length;
  const decided = S.quotes.filter(q=>["accepted","declined"].includes(q.status));
  const accRate = decided.length ? Math.round(100*decided.filter(q=>q.status==="accepted").length/decided.length) : 0;
  const rev = S.deals.reduce((a,d)=>a+d.payments.filter(p=>p.at>=m0.getTime()).reduce((x,p)=>x+p.amount,0),0);
  const active = S.leads.filter(l=>!["won","lost"].includes(l.status)).length;
  const J = [
    ["j_lead", active, "#/leads", "#0EA5E9"],
    ["j_case", S.cases.filter(c=>["pool","diagnosed"].includes(c.status)).length, "#/cases", "#F59E0B"],
    ["j_quote", S.quotes.filter(q=>["sent","viewed"].includes(q.status)).length, "#/quotes", "#6366F1"],
    ["j_accept", S.deals.filter(d=>["accepted","deposit"].includes(d.stage)).length, "#/deals", "#14B8A6"],
    ["j_visit", S.deals.filter(d=>/^v\d/.test(d.stage)).length, "#/deals", "#EC4899"],
    ["j_paid", S.deals.filter(d=>d.stage==="won").length, "#/deals", "#10B981"]];
  const tasks = S.tasks.filter(x=>!x.done && x.due<endOfDay() && (x.owner===S.me || can("approve"))).sort((a,b)=>a.due-b.due).slice(0,6);
  const acts = []; S.leads.forEach(l=>(l.activity||[]).slice(0,4).forEach(a=>acts.push({...a, l}))); acts.sort((a,b)=>b.at-a.at);
  const poolCases = S.cases.filter(c=>c.status==="pool").slice(0,4);
  const tour = S.ui.tour ? `<div class="card pad" style="margin-bottom:16px;background:linear-gradient(120deg,var(--brand-soft),var(--card))">
    <div class="row between wrap" style="gap:12px"><div class="grow"><h2>${I("spark")} ${t("tour_t")}</h2><p class="muted" style="margin:6px 0 10px">${t("tour_d")}</p>

    <button class="btn ghost icon" data-act="hideTour" aria-label="close">${I("x")}</button></div></div>` : "";
  return pageHead(greet, fmtDate(now(), null, {weekday:"long", day:"numeric", month:"long"})) + tour + `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi"><span class="l">${t("k_new")}</span><span class="v num">${newLeads}</span><span class="d muted">${t("last7")}</span></div>
    <div class="card kpi"><span class="l">${t("k_pool")}</span><span class="v num">${pool}</span><span class="d"><a href="#/cases">${t("open_pool")} →</a></span></div>
    <div class="card kpi"><span class="l">${t("k_acc")}</span><span class="v num">${accRate}%</span><span class="d muted">${t("k_sent",{n:sent})}</span></div>
    <div class="card kpi"><span class="l">${t("k_rev")}</span><span class="v num">${money(rev)}</span><span class="d muted">${t("this_month")}</span></div>
  </div>
  <h3 style="margin:4px 0 8px" class="muted small">${t("journey").toUpperCase()}</h3>
  <div class="journey" style="margin-bottom:16px">${J.map(([k,n,to,c])=>`<a href="${to}"><span class="n num">${n}</span><span class="s">${t(k)}</span><span class="bar" style="background:${c}"></span></a>`).join("")}</div>
  <div class="grid g3">
    <div class="card"><div class="hd"><h2 class="grow">${t("today_tasks")}</h2><a href="#/tasks" class="small">${t("all")} →</a></div><div class="bd" style="padding-top:4px;padding-bottom:4px"><div class="tlist">${tasks.length ? tasks.map(taskRow).join("") : emptyBox("ok", t("no_tasks"))}</div></div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("awaiting_dx")}</h2><a href="#/cases" class="small">${t("all")} →</a></div><div class="bd col">${poolCases.length ? poolCases.map(c=>{ const l = lead(c.leadId); return `<a class="row" href="#/case/${c.id}/${c.sitDone?2:1}" style="color:inherit">${av(l.name)}<div class="grow"><div style="font-weight:600">${esc(l.name)}</div><div class="tiny muted">${flag(l.country)} · ${rel(c.created)}${l.medNote?` · <span style="color:var(--err)">${esc(l.medNote)}</span>`:""}</div></div>${I("next","flip")}</a>`; }).join("") : emptyBox("ok", t("pool_empty"))}</div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("recent")}</h2></div><div class="bd"><div class="timeline">${acts.slice(0,7).map(a=>`<div class="ev"><div class="small"><a href="#/lead/${a.l.id}"><b>${esc(a.l.name)}</b></a> · ${esc(actText(a))}</div><div class="tiny faint">${rel(a.at)}</div></div>`).join("")}</div></div></div>
  </div>`;
}

ACT.toggleTask = el => { const tk = byId(S.tasks, el.dataset.id); tk.done = !tk.done; save(); if(tk.done) toast(t("task_done"), ()=>{ tk.done=false; save(); route(); }); route(); };
let taskTab = "list", taskWho = "mine";
function viewTasks(){
  const mine = taskWho==="mine" ? S.tasks.filter(x=>x.owner===S.me) : S.tasks;
  const eod = endOfDay(), groups = [["overdue", x=>!x.done && x.due<now()], ["today", x=>!x.done && x.due>=now() && x.due<=eod], ["upcoming", x=>!x.done && x.due>eod], ["done", x=>x.done]];
  let body = "";
  if(taskTab==="list") body = groups.map(([k,f])=>{ const ls = mine.filter(f).sort((a,b)=>a.due-b.due); if(!ls.length) return ""; return `<div class="card" style="margin-bottom:12px"><div class="hd"><h3 class="grow" style="${k==="overdue"?"color:var(--err)":""}">${t("g_"+k)} <span class="bdg">${ls.length}</span></h3></div><div class="bd" style="padding-top:0;padding-bottom:0"><div class="tlist">${ls.map(taskRow).join("")}</div></div></div>`; }).join("") || `<div class="card">${emptyBox("ok", t("no_tasks"))}</div>`;

}

function viewDeals(){
  const maxV = Math.max(2, ...S.deals.map(d=>d.visitsInfo.length));
  const stages = ["accepted","deposit", ...Array.from({length:maxV},(_,i)=>"v"+(i+1)), "won"];
  const open = S.deals.filter(d=>d.stage!=="lost");
  const pipe = open.filter(d=>d.stage!=="won").reduce((a,d)=>a+toEUR(d.value,d.cur),0);

function paintSit(c, tt, mode){
  const cur = c.situation[tt] || {}, b = W.brush;
  if(b==="sinusSark" || b==="kemikAz"){
    if(b==="sinusSark" && (jawOf(tt)!=="u" || tt%10<4)) return;
    if(b==="kemikAz" && (jawOf(tt)!=="l" || tt%10<4)) return;
    const f = Object.assign({}, cur.f); if(mode==="erase") delete f[b]; else f[b] = true;
    const n = Object.assign({}, cur, {f}); if(!Object.keys(f).length) delete n.f; if(!n.s && !n.f) delete c.situation[tt]; else c.situation[tt] = n; return;
  }
  if(mode==="erase" || b==="intact"){ if(cur.f) c.situation[tt] = {f:cur.f}; else delete c.situation[tt]; }
  else c.situation[tt] = Object.assign({}, cur, {s:b});
}

function wireChart(c){
  const box = document.getElementById("chart"); if(!box) return;
  let down = false, mode = null, touched = new Set();
  const hitT = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const g = el && el.closest && el.closest("[data-t]"); return g && box.contains(g) ? +g.dataset.t : null; };
  const apply = tt => {
    if(touched.has(tt)) return; touched.add(tt);
    if(box.dataset.mode==="sit"){
      if(mode===null){ const cur = c.situation[tt]||{}; const b = W.brush; mode = ((b==="sinusSark"||b==="kemikAz") ? (cur.f&&cur.f[b]) : cur.s===b) ? "erase" : "paint"; }
      paintSit(c, tt, mode); save();
    } else {
      if(W.bSel){ W.bSel = null; W.sel.clear(); }
      if(mode===null) mode = W.sel.has(tt) ? "erase" : "paint";
      if(mode==="erase") W.sel.delete(tt); else W.sel.add(tt);
    }
    refreshChart(c);
  };
  box.addEventListener("pointerdown", e=>{ const tt = hitT(e); if(tt==null) return; down = true; mode = null; touched = new Set(); box.setPointerCapture && box.setPointerCapture(e.pointerId); apply(tt); e.preventDefault(); });
  box.addEventListener("pointermove", e=>{ if(!down) return; const tt = hitT(e); if(tt!=null) apply(tt); });
  const up = () => { down = false; mode = null; };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up); box.addEventListener("lostpointercapture", up);
}

function rerenderPlan(c){ const pg = document.getElementById("page"); pg.innerHTML = viewCase(c.id, 2); wireCase(c, 2); }

ACT.vis = el => {

};
ACT.addItem = () => {
  const c = kase(route.params[0]);
  const teeth = [...W.sel].sort((a,b)=>ALL_TEETH.indexOf(a)-ALL_TEETH.indexOf(b));
  pushUndo();
  if(W.bSel){
    const b = bundle(W.bSel), it = {id:uid("i"), v:W.curV, b:b.id, teeth:b.teeth.slice()};
    W.items.push(it); W.newIds.add(it.id);
    autoExtract(c, b.imp, W.curV);
  } else {
    const x = tx(W.txSel); if(!x) return;
    const it = {id:uid("i"), v:W.curV, tx:x.id, teeth:(x.unit==="tooth"||x.unit==="side")?teeth:[]};
    if(x.brands) it.brand = (document.getElementById("brandSel")||{}).value || W.brand;
    if(x.unit==="arch") it.jaws = W.jaws.slice();
    if(x.unit==="piece"||x.unit==="mouth") it.qty = Math.max(1, +((document.getElementById("qtyIn")||{}).value) || 1);
    // aynı ziyarette aynı tedavi+marka varsa birleştir
    const same = W.items.find(i=>i.v===it.v && i.tx===it.tx && (i.brand||"")===(it.brand||"") && x.unit==="tooth");
    if(same){ it.teeth.forEach(tt=>{ if(!same.teeth.includes(tt)) same.teeth.push(tt); }); W.newIds.add(same.id); }
    else { W.items.push(it); W.newIds.add(it.id); }
    if(x.render==="implant") autoExtract(c, teeth, W.curV);

function autoExtract(c, teeth, v){
  const sit = c.situation||{}, cur = toothStates(wcase(c), "plan");
  const need = teeth.filter(tt=>{ const s = sit[tt]; const present = !s || ["intact","root","rct","crown","caries","comp","amalg","inlay","veneer","bridge","impacted","other"].includes(s.s); return present && !cur[tt].cekim && !(s && ["impab","impcr"].includes(s.s)); });
  if(!need.length) return;
  const ex = W.items.find(i=>i.v===v && i.tx==="ext_simple");
  if(ex) need.forEach(tt=>{ if(!ex.teeth.includes(tt)) ex.teeth.push(tt); });
  else { const it = {id:uid("i"), v, tx:"ext_simple", teeth:need, auto:true}; W.items.push(it); W.newIds.add(it.id); }
  toast(t("auto_ext",{teeth:need.join(", ")}));
}

ACT.completePlan = () => {
  const c = kase(route.params[0]), rs = checkRules(wcase(c), W.items);
  const blocks = rs.filter(r=>r.sev==="block"), warns = rs.filter(r=>r.sev!=="block");
  if(blocks.length){

  }
  const finish = () => {
    closeOverlay();
    const first = c.status==="pool";
    W.dirty = true; commitWS(c);
    c.status = c.status==="sent" ? "diagnosed" : (c.status==="pool" ? "diagnosed" : c.status);

    if(!c.pricing) initPricing(c, lead(c.leadId));
    setLeadStatus(c.leadId, "plan_ready");
    addActivity(c.leadId, "dx", warns.length ? warns.map(r=>r.code).join(",") : "ok");
    save();
    if(can("price")){ toast(t("dx_done")); location.hash = `#/case/${c.id}/3`; }
    else { toast(t("dx_sent_sales")); route(); }
  };
  if(!warns.length){
    confirmBox(t("complete_dx"), t("complete_dx_d"), t("confirm")).then(ok=>{ if(ok) finish(); });
    return;
  }
  const m = openModal(`<div class="hd">${I("alert").replace("<svg",'<svg style="width:28px;height:28px;color:var(--warn);flex:none"')}<div><h2>${t("clin_warn")}</h2><p class="muted small" style="margin:4px 0 0">${t("clin_warn_d")}</p></div></div><div class="bd col">${warns.map(r=>`<div class="alert ${r.sev==="info"?"info":"warn"}">${I(r.sev==="info"?"info":"alert")}<span><b>${r.code}</b> · ${esc(ruleText(r))}</span></div>`).join("")}</div><div class="ft"><button class="btn" data-act="close">${t("go_back")}</button><button class="btn pri" id="ackGo">${t("ack_proceed")}</button></div>`);
  m.querySelector("#ackGo").onclick = finish;
};

function wireCatalog(){
  const upd = (sel, fn) => document.querySelectorAll(sel).forEach(el=> el.onchange = () => { fn(el); save(); toast(t("saved")); });
  upd("[data-txp]", el=> tx(el.dataset.txp).price = +el.value||0);
  upd("[data-txa]", el=> tx(el.dataset.txa).active = el.checked);
  upd("[data-bp]", el=> bundle(el.dataset.bp).price = +el.value||0);
  upd("[data-ba]", el=> bundle(el.dataset.ba).active = el.checked);
  upd("[data-rule]", el=> S.catalog.rules[el.dataset.rule] = el.checked);
  upd("[data-brp]", el=>{ const [id,i] = el.dataset.brp.split("|"); tx(id).brands[+i].price = +el.value||0; });
  upd("[data-brn]", el=>{ const [id,i] = el.dataset.brn.split("|"); tx(id).brands[+i].n = el.value; });
}
ACT.catTab = el => { catTab = el.dataset.v; route(); };
ACT.brands = el => { openBrands = openBrands===el.dataset.id ? null : el.dataset.id; route(); };
ACT.addBrand = el => { const x = tx(el.dataset.id); x.brands.push({id:uid("b"), n:t("new_brand"), price:x.brands[x.brands.length-1].price, form:"std"}); save(); route(); };
ACT.resetCat = async () => { if(await confirmBox(t("reset_defaults"), t("reset_cat_q"), t("reset_defaults"), true)){ S.catalog.tx = clone(TX_SEED); S.catalog.bundles = clone(BUNDLE_SEED); save(); route(); toast(t("saved")); } };
ACT.newTx = () => {
  openDrawer(t("new_tx"), `<div class="grid g2"><label class="f">${t("name")} (TR)<input class="inp" id="ntTr"></label><label class="f">${t("name")} (EN)<input class="inp" id="ntEn"></label></div>
    <div class="grid g2"><label class="f">${t("category")}<select class="inp" id="ntC">${Object.keys(CATS).map(k=>`<option value="${k}">${tn(CATS[k])}</option>`).join("")}</select></label>
    <label class="f">${t("unit")}<select class="inp" id="ntU">${["tooth","side","arch","mouth","piece"].map(u=>`<option value="${u}">${t("u_"+u)}</option>`).join("")}</select></label></div>
    <div class="grid g2"><label class="f">${t("chart_icon")}<select class="inp" id="ntR">${["none","implant","crown","veneer","ext","fill","inlay","rct","graft","sinus","arch"].map(r=>`<option value="${r}">${t("rd_"+r)}</option>`).join("")}</select></label>
    <label class="f">${t("price")} (EUR)<input class="inp" type="number" id="ntP" value="100"></label></div>
    <label class="f">${t("allowed_v")}<div class="row">${[1,2,3,4].map(v=>`<label class="row small" style="gap:4px"><input type="checkbox" class="ntV" value="${v}" ${v<=2?"checked":""}>V${v}</label>`).join("")}</div></label>`,
    `<button class="btn" data-act="close">${t("cancel")}</button><button class="btn pri" id="ntSave">${t("save")}</button>`, d=>{
      d.querySelector("#ntSave").onclick = () => { const tr = d.querySelector("#ntTr").value.trim(), en = d.querySelector("#ntEn").value.trim() || tr; if(!tr) return d.querySelector("#ntTr").focus();
        const r = d.querySelector("#ntR").value;
        S.catalog.tx.push(TX(uid("x"), d.querySelector("#ntC").value, [tr,en,en,en], d.querySelector("#ntU").value, r, +d.querySelector("#ntP").value||0, {visits:[...d.querySelectorAll(".ntV:checked")].map(x=>+x.value), color:"#0E7C86", mat:r==="crown"?"zr":r==="veneer"?"por":undefined}));
        save(); closeOverlay(); toast(t("saved")); route(); };
    });
};

/* ---------------- AYARLAR ---------------- */

  const C = S.clinic;
  const f = (k, label, type, extra) => `<label class="f">${label}<input class="inp sm" data-cs="${k}" ${type?`type="${type}"`:""} value="${esc(C[k])}" ${extra||""}></label>`;
  const presets = ["#0E7C86","#2563EB","#7C3AED","#DB2777","#EA580C","#16A34A","#0F172A","#B45309"];
  return pageHead(t("nav_settings"), t("settings_sub")) + `<div class="grid g2" style="align-items:start">
  <div class="col" style="gap:14px">
    <div class="card"><div class="hd"><h2 class="grow">${t("clinic_id")}</h2></div><div class="bd grid g2">${f("name",t("clinic_name"))}${f("legal",t("legal_name"))}${f("phone",t("phone"))}${f("email","E-mail","email")}${f("web","Web")}${f("city",t("city"))}<label class="f" style="grid-column:1/-1">${t("address")}<input class="inp sm" data-cs="address" value="${esc(C.address)}"></label></div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("brand_color")}</h2><span class="tiny muted">${t("brand_hint")}</span></div><div class="bd row wrap">${presets.map(p=>`<button data-act="color" data-v="${p}" style="width:30px;height:30px;border-radius:50%;background:${p};border:3px solid ${C.color===p?"var(--text)":"transparent"};cursor:pointer" aria-label="${p}"></button>`).join("")}<input type="color" data-cs="color" value="${C.color}" style="width:40px;height:32px;border:0;background:none;cursor:pointer"></div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("money_locale")}</h2></div><div class="bd col">
      <div class="grid g2"><label class="f">${t("def_currency")}<select class="inp sm" data-cs="cur">${CURS.map(x=>`<option ${C.cur===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">${t("numbering")}<select class="inp sm" data-cs="numbering">${["FDI","UNIVERSAL","PALMER"].map(x=>`<option ${C.numbering===x?"selected":""}>${x}</option>`).join("")}</select></label></div>
      <div class="small muted">${t("fx_rates")} (1 EUR =)</div><div class="grid g3">${CURS.filter(x=>x!=="EUR").map(x=>`<label class="f">${x}<input class="inp sm num" type="number" step="0.01" data-fx="${x}" value="${C.fx[x]}"></label>`).join("")}</div></div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("data")}</h2></div><div class="bd row wrap"><button class="btn" data-act="exportData">${I("download")}${t("export_json")}</button><label class="btn">${I("upload")}${t("import_json")}<input type="file" accept=".json" id="impFile" class="hide"></label><span class="grow"></span><button class="btn danger" data-act="resetDemo">${t("reset_demo")}</button></div></div>
  </div>
  <div class="col" style="gap:14px">
    <div class="card"><div class="hd"><h2 class="grow">${t("quote_defaults")}</h2></div><div class="bd grid g2">${f("deposit",t("deposit")+" %","number")}${f("valid",t("valid_days"),"number")}${f("rounding",t("rounding_step"),"number")}${f("hotelNight",t("hotel_night_eur"),"number")}${f("transfer",t("transfer_eur"),"number")}<div></div>${f("gapMin",t("gap_min"),"number")}${f("gapMax",t("gap_max"),"number")}</div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("disc_limits")}</h2><span class="tiny muted">${t("disc_hint")}</span></div><div class="bd grid g3">${Object.keys(ROLES).map(r=>`<label class="f">${t("role_"+r)}<div class="row"><input class="inp sm num" type="number" min="0" max="100" data-lim="${r}" value="${C.limits[r]}"><span>%</span></div></label>`).join("")}</div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("team")}</h2><button class="btn sm" data-act="addUser">${I("plus")}${t("add_user")}</button></div><div class="bd col" style="gap:8px">${S.users.map(u=>`<div class="row">${av(u.id)}<input class="inp sm grow" data-un="${u.id}" value="${esc(u.name)}"><select class="inp sm" data-ur="${u.id}" style="width:auto">${Object.keys(ROLES).map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${t("role_"+r)}</option>`).join("")}</select></div>`).join("")}
      <div class="alert info">${I("info")}<span>${t("roles_hint")}</span></div></div></div>
    <div class="card"><div class="hd"><h2 class="grow">${t("perm_matrix")}</h2></div><div class="twrap"><table class="tbl"><thead><tr><th></th>${Object.keys(ROLES).map(r=>`<th>${t("role_"+r)}</th>`).join("")}</tr></thead><tbody>${["leads","cases","dx","price","send","approve","deals","catalog","settings","money"].map(p=>`<tr><td class="small">${t("perm_"+p)}</td>${Object.keys(ROLES).map(r=>`<td>${ROLES[r].perm.includes(p)?`<span style="color:var(--ok)">●</span>`:`<span class="faint">○</span>`}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  </div></div>`;
